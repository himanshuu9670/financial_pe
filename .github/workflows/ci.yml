name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdf_editor
          POSTGRES_PASSWORD: pdf_editor_secret
          POSTGRES_DB: pdf_editor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app --ignore E501
      - name: Generate QA PDF fixtures
        run: python scripts/generate_test_pdfs.py
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://pdf_editor:pdf_editor_secret@localhost:5432/pdf_editor_db
          REDIS_URL: redis://localhost:6379/0
          AUTH_DISABLED: 'true'
          REDIS_CACHE_ENABLED: 'false'
        run: pytest tests/ -q -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
