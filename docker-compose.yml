# Stable project name (avoids issues when the folder path contains spaces)
name: statementforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf_editor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdf_editor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf_editor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_editor_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_editor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdf_editor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_editor_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pdf_editor}:${POSTGRES_PASSWORD:-pdf_editor_secret}@postgres:5432/${POSTGRES_DB:-pdf_editor_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /app/storage
      STORAGE_ORIGINAL: /app/storage/original_pdfs
      STORAGE_EDITED: /app/storage/edited_pdfs
      STORAGE_PREVIEWS: /app/storage/previews
      STORAGE_TEMP: /app/storage/temp
      STORAGE_LOGS: /app/storage/logs
      STORAGE_SNAPSHOTS: /app/storage/snapshots
      STORAGE_EXPORTS: /app/storage/exports
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret-min-32-chars-long}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python /app/scripts/ensure_database.py
        alembic upgrade head
        python /app/scripts/seed_demo_user.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_editor_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pdf_editor}:${POSTGRES_PASSWORD:-pdf_editor_secret}@postgres:5432/${POSTGRES_DB:-pdf_editor_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /app/storage
      STORAGE_ORIGINAL: /app/storage/original_pdfs
      STORAGE_EDITED: /app/storage/edited_pdfs
      STORAGE_PREVIEWS: /app/storage/previews
      STORAGE_TEMP: /app/storage/temp
      STORAGE_LOGS: /app/storage/logs
      STORAGE_SNAPSHOTS: /app/storage/snapshots
      STORAGE_EXPORTS: /app/storage/exports
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret-min-32-chars-long}
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker -Q default,ocr,export,ai --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_editor_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
